name: validate
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i -g @anthropic-ai/claude-code@2.1.322
      - run: claude plugin validate .
      - name: check script tests
        run: python3 tests/test_check.py
      - name: catalog matches each plugin repo
        run: python3 scripts/check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
